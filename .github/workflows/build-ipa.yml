# 云端打包原生 IPA：用你的证书签名（Ad-Hoc 分发）
# 需要 GitHub Secrets：IOS_P12_BASE64 / IOS_P12_PASSWORD / IOS_MOBILEPROVISION_BASE64
name: 云打包IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 导入签名证书 (P12)
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          set -euxo pipefail
          echo "$P12_BASE64" | base64 --decode > /tmp/sign.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/sign.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain

      - name: 安装描述文件
        env:
          MP_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$MP_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/realfps.mobileprovision"

      - name: 解析签名身份与描述文件 UUID
        id: sign
        run: |
          set -euxo pipefail
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep -oE 'Apple (Developer|Distribution): .*' | head -1 | sed -E 's/^[0-9A-F]*" //' | sed 's/"//g' | cut -d'(' -f1 | sed 's/ *$//')
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          UUID=$(security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/realfps.mobileprovision" | plutil -extract UUID raw -)
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"

      - name: 编译并签名（原生）
        run: |
          xcodebuild \
            -project RealFPS.xcodeproj \
            -scheme RealFPS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=2TAD594A66 \
            PRODUCT_BUNDLE_IDENTIFIER=com.cert.account.t260901214911 \
            CODE_SIGN_IDENTITY="${{ steps.sign.outputs.identity }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.sign.outputs.uuid }}" \
            build

      - name: 打包 IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/RealFPS.app build/ipa/Payload/
          cd build/ipa && zip -qry ../../RealFPS.ipa Payload && cd ../..
          ls -lh RealFPS.ipa

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: RealFPS-ipa
          path: RealFPS.ipa
