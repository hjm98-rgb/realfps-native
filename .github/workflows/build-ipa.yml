# 云端打包原生 IPA：用你的证书签名（Ad-Hoc 分发）
# Secrets：IOS_P12_BASE64 / IOS_P12_PASSWORD / IOS_MOBILEPROVISION_BASE64
name: 云打包IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 导入签名证书 (P12)
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
        run: |
          set -euxo pipefail
          echo "$P12_BASE64" | base64 --decode > /tmp/sign.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          # 证书密码为 1（已验证），直接写死，避免密钥表单取值异常
          security import /tmp/sign.p12 -k build.keychain -P "1" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: 安装描述文件
        env:
          MP_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$MP_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/realfps.mobileprovision"
          ls -lh "$HOME/Library/MobileDevice/Provisioning Profiles/realfps.mobileprovision"

      - name: 编译并签名（原生）
        run: |
          set -euxo pipefail
          xcodebuild \
            -project RealFPS.xcodeproj \
            -scheme RealFPS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=2TAD594A66 \
            CODE_SIGN_IDENTITY="Apple Distribution: Terry Peppers (2TAD594A66)" \
            PROVISIONING_PROFILE_SPECIFIER="f34bc930-4015-4dea-94f1-6be9ac79879a" \
            build

      - name: 打包 IPA
        run: |
          set -euxo pipefail
          mkdir -p build/ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/RealFPS.app build/ipa/Payload/
          cd build/ipa && zip -qry ../../RealFPS.ipa Payload && cd ../..
          ls -lh RealFPS.ipa

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: RealFPS-ipa
          path: RealFPS.ipa
