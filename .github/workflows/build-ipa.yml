name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: |
          ls -la
          xcodegen generate --spec project.yml
      - name: Build unsigned ipa
        run: |
          set -x
          PROJ=$(find . -maxdepth 2 -name "*.xcodeproj" | head -1)
          SCHEME=$(xcodebuild -project "$PROJ" -list 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF&&!/-/{print $1; exit}')
          echo "SCHEME=$SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: unsigned.ipa
